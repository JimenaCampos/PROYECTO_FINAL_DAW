<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="/static/css/usuario.css">
    <title>Usuario</title>
</head>
<body>
    <div id="header-placeholder"></div>
    <main class="grid">
        <div id="barra_lateral_administrador-placeholder"></div>
        <div class="contenido-principal">
            <div class="contenido">   
            <h3 class="titulo-seccion">Usuario</h3>
              <!--Busqueda-->
              <form id="formDocumento">
                <!-- Label -->
                <label for="inputDocumento">Nombre del Usuario:</label>

                <!-- Input -->
                <input type="text" id="inputDocumento" placeholder="Ingrese nombre del Usuario"/>

                <!-- Botones -->
                <button type="button" id="btn_buscar" class="btn-icon" title="Buscar">
                    <img src="/static/img/lupa.png" alt="Buscar" />
                </button>

                <button type="submit" id="btn_guardar" class="btn-icon" title="Agregar">
                    <img src="/static/img/mas.png" alt="Agregar" />
                </button>
            </form>

            <!--Tabla-->
            <div class="tabla-documentos">
              <table id="tablaDocumentos">
                <thead>
                  <tr>
                    <th class="col-id">#</th>
                    <th class="col-nombre">Nombre y Apellidos</th>
                    <th class="col-numDocumento">Numero de doscumento</th>
                    <th class="col-tipoDocumento">Tipo de Documento</th>
                    <th class="col-correo">Correo electronico</th>
                    <th class="col-telefono">Telefono</th>
                    <th class="col-clave">Clave</th>
                    <th class="col-tipo de usario">Tipo de usuario</th>
                    <th class="col-cargo">Cargo</th>
                    <th class="col-acciones">Acciones</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
            <div id="paginacionContainer"></div>
        </div>
        </div>
    <script src="/static/js/barra_lateral.js"></script>
    <script src="/static/js/header.js"></script>
    <script src="/static/js/usuario.js"></script>
</body>
</html>
