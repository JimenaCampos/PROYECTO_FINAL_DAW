<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizz Menu</title>
    <link rel="stylesheet" href="/static/css/contenido.css">
</head>
<body>
    <div id="header-placeholder"></div>
    <div id="barra_lateral-placeholder"></div>

    <div id="Contenido">
        <div class="welcome-card">
            <h1> Bienvenido a Quizz!</h1>
            <p>Prepárate para aprender y competir en tus cuestionarios favoritos.</p>
            <div class="acciones">
                <button class="btn">Jugar Ahora</button>
                <button class="btn">Crear Quiz</button>
                <button class="btn">Mis Resultados</button>
            </div>
        </div>

        <div class="stats-card">
            <h2>Tu Progreso</h2>
            <div class="stats">
                <div class="stat">
                    <h3>12</h3>
                    <p>Quizzes Jugados</p>
                </div>
                <div class="stat">
                    <h3>8</h3>
                    <p>Quizzes Creados</p>
                </div>
                <div class="stat">
                    <h3>85%</h3>
                    <p>Promedio de Aciertos</p>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="/static/js/header.js"></script>
    <script src="/static/js/footer.js"></script>
    <script src="/static/js/barra_laretal.js"></script>
</body>
</html>
