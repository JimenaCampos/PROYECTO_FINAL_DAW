<!DOCTYPE html>
<html>
<head>
    <title>Usuarios</title>
</head>
<body>
    <h1>Lista de usuarios</h1>
    <a href="{{ url_for('registro') }}">Registrar nuevo</a>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th><th>Nombres</th><th>Apellido Paterno</th><th>Correo</th><th>Rol</th><th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for u in usuarios %}
            <tr>
                <td>{{ u.id }}</td>
                <td>{{ u.nombres }}</td>
                <td>{{ u.ape_pat }}</td>
                <td>{{ u.correo }}</td>
                <td>{{ u.rol }}</td>
                <td>
                    <a href="{{ url_for('editar_usuario', id=u.id) }}">Editar</a>
                    <a href="{{ url_for('eliminar_usuario', id=u.id) }}" onclick="return confirm('¿Eliminar usuario?')">Eliminar</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
